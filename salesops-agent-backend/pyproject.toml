[project]
name = "salesops-agent-backend"
version = "1.0.0"
description = "Autonomous Content-to-Action SalesOps Agent — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Web framework ────────────────────────────────────────────────
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.47.0",
    "python-multipart>=0.0.28",

    # ── Database (Neon Postgres) ─────────────────────────────────────
    "sqlalchemy>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.0",

    # ── Auth (JWT / JWKS) ────────────────────────────────────────────
    "python-jose[cryptography]>=3.5.0",
    "cryptography>=48.0.0",
    "httpx>=0.28.0",

    # ── AI / LLM ─────────────────────────────────────────────────────
    "openai>=2.36.0",

    # ── Config ───────────────────────────────────────────────────────
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.0",

    # ── Google / Firebase (Places, Calendar) ─────────────────────────
    "google-api-core>=2.30.0",
    "google-auth>=2.52.0",
    "firebase-admin>=7.4.0",

    # ── MCP SDK ──────────────────────────────────────────────────────
    "mcp>=1.27.0",

    # ── HTTP / SSE ───────────────────────────────────────────────────
    "requests>=2.34.0",
    "sse-starlette>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "api", "core", "db", "mcp_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
